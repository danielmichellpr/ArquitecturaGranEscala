data:
  raw_path: "./data/raw/"
  results_path: "./data/results/"

preprocessing:
  detect_outliers:
    column: "item_price"
    iqr_factor: 1.5
    z_threshold: 3
    lower_percentile: 0.01
    upper_percentile: 0.99

model:
  type: "random_forest"
  hyperparameters:
    n_estimators: 100
    random_state: 42
    max_depth: 3
    learning_rate: 0.1

output:
  submission_filename: "submission.csv"
  full_predictions_filename: "full_predictions.csv"
